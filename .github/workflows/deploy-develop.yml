name: Deploy the preview

# The homebrew rework is shown to testers at https://develop.heroquill.app while it is not in the
# normal version. Every push to the branch builds it and replaces the preview; the normal site, its
# tests and its deploy (deploy.yml) are not touched.
on:
  push:
    branches: [homebrew-rework]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-develop
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_CHANNEL: develop
      - run: node scripts/develop-channel.mjs
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.develop.jsonc
