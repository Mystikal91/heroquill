name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: actions/upload-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          name: site
          path: dist

  # The importer against all of Aurora's content, kept at a fixed commit so that a failure is
  # always about our change. To move to newer content, change the commit and look at the result.
  corpus:
    runs-on: ubuntu-latest
    env:
      AURORA_COMMIT: c28ce6cd77ff92f7e0c99c5617a76cbe8371e35d
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Aurora's content at the fixed commit
        run: |
          git init "$RUNNER_TEMP/aurora"
          git -C "$RUNNER_TEMP/aurora" fetch --depth 1 https://github.com/AuroraLegacy/elements.git "$AURORA_COMMIT"
          git -C "$RUNNER_TEMP/aurora" checkout FETCH_HEAD
      - run: npm run test:corpus
        env:
          AURORA_CORPUS: ${{ runner.temp }}/aurora

  # The printed sheet in a real Chrome: the pages of each test character, and no block cut in two.
  # See scripts/print-check/README.md. It does not hold back the deploy (yet): see the note there.
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:print
        env:
          CHROME: /usr/bin/google-chrome

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, corpus]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: dist
      # The relay of the online table (rooms.heroquill.app) goes first, so the app never points at a
      # relay that is not there. It needs no npm packages: wrangler bundles it from the checkout.
      - name: Deploy the online table's relay
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config workers/room-relay/wrangler.toml
      - name: Deploy the site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
