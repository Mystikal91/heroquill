name = "heroquill-rooms"
main = "worker.ts"
compatibility_date = "2024-11-01"

# The relay of the DM mode: one Durable Object (a room) for each join code.
# Free plan: only SQLite-backed objects are allowed, hence new_sqlite_classes.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Sites allowed to open a socket (comma separated). Without it: the published app, the preview
# and the local dev servers.
# [vars]
# ALLOWED_ORIGINS = "https://heroquill.app,https://develop.heroquill.app"

# The custom domain (rooms.heroquill.app) is set on the Worker in the Cloudflare dashboard, or here:
# routes = [{ pattern = "rooms.heroquill.app", custom_domain = true }]
